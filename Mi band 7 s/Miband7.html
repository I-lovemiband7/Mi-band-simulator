<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi Band 7 Emulator Completo</title>
<style>
:root { --accent:#00e676; }
body { margin:0; background:#222; display:flex; justify-content:center; align-items:center; height:100vh; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto; }
.band { width:230px; height:490px; background:#000; border-radius:42px; padding:12px; box-shadow:0 0 40px rgba(0,0,0,.8); position:relative; overflow:hidden; }
.screen { width:100%; height:100%; border-radius:32px; color:white; position:relative; display:flex; flex-direction:column; overflow:hidden; }
.background { position:absolute; inset:0; z-index:0; background-size:cover; background-position:center; }
.page { flex:1; padding:16px; overflow-y:hidden; position:relative; z-index:1; }
.page.nowatchface {animation:none;}
.time {font-size:3rem; text-align:center; margin-top:70px;}
.date {text-align:center; opacity:.7;}
.center {text-align:center; margin-top:30px;}
.app { background:rgba(255,255,255,.05); border-radius:16px; padding:14px; margin:10px 0; text-align:center; font-size:1.05rem; cursor:pointer; transition: transform .15s, background .2s; }
.app:active {transform:scale(.96); background:rgba(255,255,255,.15);}
.back {text-align:center; color:var(--accent); margin-top:16px; cursor:pointer;}
.progress-bar { background:rgba(255,255,255,.2); border-radius:8px; height:12px; width:100%; margin:10px 0; overflow:hidden; }
.progress-bar-inner { background:var(--accent); height:100%; width:0%; transition:width .3s; }
#instructions { position:fixed; top:10px; right:10px; background:rgba(0,0,0,0.6); color:white; padding:10px 14px; border-radius:12px; font-size:0.85rem; line-height:1.4; max-width:200px; box-shadow:0 0 10px rgba(0,0,0,0.5); z-index:1000; }
#instructions h3 {margin:0 0 6px 0; font-size:0.95rem; color:var(--accent);}
canvas {border-radius:12px; display:block; margin:auto; background:#4ec0ca;}
</style>
</head>
<body>
<div class="band">
  <div class="screen" id="screen">
    <div class="background" id="bg"></div>
    <div id="pageContainer"></div>
  </div>
</div>

<div id="instructions">
  <h3>Controles:</h3>
  W ↑ : abrir menú<br>
  S ↓ : volver reloj<br>
  X : salir de app → menú<br>
  Barra espacio: flappy saltar<br>
  Q / E : bajar/subir volumen música<br>
  Scroll: mover apps largas<br>
  W A S D: snake
</div>

<script>
// =================== VARIABLES ===================
const pageContainer = document.getElementById("pageContainer");
const bg = document.getElementById("bg");
let currentApp = "watchface";
let bgOpacity = localStorage.getItem("bgOpacity") ? parseFloat(localStorage.getItem("bgOpacity")) : 0.7;
let bgImage = localStorage.getItem("bgImage") || "fondo1.jpg"; 

let audio = new Audio();
let playlist = ['beethoven.mp3','paganini.mp3'];
let currentSongIndex = -1;
let volume = 0.5; 

// =================== FONDO ===================
function updateBackground(){
  if(bgImage){
    bg.style.backgroundImage = `url(${bgImage})`;
    bg.style.opacity = bgOpacity;
  } else {
    bg.style.background = `linear-gradient(180deg, rgba(17,17,17,${bgOpacity}), rgba(51,51,51,${bgOpacity}))`;
  }
}
updateBackground();

// =================== LOAD PAGE ===================
function load(html, appName, noAnim=false){
  pageContainer.innerHTML = `<div class="page ${noAnim?"nowatchface":""}" id="page">${html}</div>`;
  currentApp = appName;
}

// =================== SCROLL ===================
pageContainer.addEventListener("wheel", e=>{
  const page = document.getElementById("page");
  if(page){
    page.scrollTop += e.deltaY;
    e.preventDefault();
  }
},{passive:false});

// =================== WATCHFACE ===================
function watchface(){
  const now = new Date();
  load(`
    <div class="time">${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}</div>
    <div class="date">${now.toDateString()}</div>
    <div class="center"><div class="app" onclick="menu()">abrir apps</div></div>
  `,"watchface",true);
}
setInterval(()=>{ if(currentApp==="watchface") watchface(); },1000);

// =================== MENÚ ===================
function menu(){
  load(`
    <h2 class="center">apps</h2>
    <div class="app" onclick="pasos()">pasos</div>
    <div class="app" onclick="ritmo()">ritmo</div>
    <div class="app" onclick="musicApp()">música</div>
    <div class="app" onclick="social()">social</div>
    <div class="app" onclick="games()">juegos</div>
    <div class="app" onclick="settings()">configuración</div>
    <div class="back" onclick="watchface()">volver</div>
  `,"menu");
}

// =================== PASOS ===================
function pasos(){ 
  let steps = Math.floor(Math.random()*10000);
  let goal = 8000;
  let percent = Math.min(100, Math.round((steps/goal)*100));
  load(`
    <h2 class="center">pasos</h2>
    <p class="center">${steps} pasos</p>
    <div class="progress-bar"><div class="progress-bar-inner" style="width:${percent}%"></div></div>
    <p class="center">Meta: ${goal}</p>
    <div class="back" onclick="menu()">volver</div>
  `,"pasos"); 
}

// =================== RITMO ===================
function ritmo(){ 
  let bpm = 60 + Math.floor(Math.random()*60);
  let minBpm = 60, maxBpm = 120;
  let percent = Math.min(100, Math.round(((bpm-minBpm)/(maxBpm-minBpm))*100));
  load(`
    <h2 class="center">ritmo</h2>
    <p class="center">${bpm} bpm</p>
    <div class="progress-bar"><div class="progress-bar-inner" style="width:${percent}%"></div></div>
    <p class="center">Min: ${minBpm} Max: ${maxBpm}</p>
    <div class="back" onclick="menu()">volver</div>
  `,"ritmo"); 
}

// =================== MÚSICA ===================
function musicApp(){
  load(`
    <h2 class="center">música</h2>
    <div class="app" onclick="playSong(0)">novena sinfonía – beethoven</div>
    <div class="app" onclick="playSong(1)">la campanella – paganini</div>
    <div class="app" onclick="pauseSong()">pausar / reanudar</div>
    <p class="center" id="songName"></p>
    <p class="center" id="volumeDisplay">volumen: ${Math.round(volume*100)}%</p>
    <div class="back" onclick="stopMusic(); menu()">volver</div>
  `,"music");
  audio.volume = volume;
  currentSongIndex = -1;
}
function playSong(index){
  currentSongIndex = index;
  audio.src = playlist[index];
  audio.volume = volume;
  audio.play();
  document.getElementById('songName').textContent = index===0?"Novena Sinfonía – Beethoven":"La Campanella – Paganini";
  updateVolumeDisplay();
}
function pauseSong(){ if(audio){ audio.paused?audio.play():audio.pause(); }}
function stopMusic(){ if(audio){ audio.pause(); audio.currentTime=0; document.getElementById('songName')?.remove(); updateVolumeDisplay(); }}
function updateVolumeDisplay(){ const display = document.getElementById('volumeDisplay'); if(display) display.textContent = "Volumen: "+Math.round(volume*100)+"%"; }

// =================== SOCIAL ===================
function social(){
  load(`
    <h2 class="center">social</h2>
    <div class="app">youtube (simulado)</div>
    <div class="app">facebook (simulado)</div>
    <div class="back" onclick="menu()">volver</div>
  `,"social");
}

// =================== JUEGOS ===================
function games(){
  load(`
    <h2 class="center">juegos</h2>
    <div class="app" onclick="flappy()">flappy</div>
    <div class="app" onclick="snake()">snake</div>
    <div class="back" onclick="menu()">volver</div>
  `,"games");
}

// =================== CONFIGURACIÓN ===================
function settings(){
  load(`
    <h2 class="center">configuración</h2>
    <div class="app" onclick="setBgOpacity(0.5)">transparencia baja</div>
    <div class="app" onclick="setBgOpacity(0.7)">transparencia media</div>
    <div class="app" onclick="setBgOpacity(0.9)">transparencia alta</div>
    <div class="app" onclick="setBgImage('fondo1.jpg')">fondo 1</div>
    <div class="app" onclick="setBgImage('fondo2.jpg')">fondo 2</div>
    <div class="app" onclick="setBgImage(null)">sin fondo</div>
    <div class="back" onclick="menu()">volver</div>
  `,"settings");
}
function setBgOpacity(value){ bgOpacity=value; localStorage.setItem("bgOpacity",value); updateBackground(); menu();}
function setBgImage(file){ bgImage=file; localStorage.setItem("bgImage",file); updateBackground(); menu();}

// =================== FLAPPY ===================
function flappy(){
  load(`<h2 class="center">flappy</h2><canvas id="game" width="200" height="260"></canvas><p class="center" id="score">score: 0</p><div class="back" onclick="games()">volver</div>`,"flappy");
  const canvas=document.getElementById("game");
  const ctx=canvas.getContext("2d");
  let y=120,v=0,gravity=0.5,obstacles=[],frame=0,score=0,gameOver=false;
  function spawn(){ let h=Math.floor(Math.random()*120)+20; obstacles.push({x:200,top:h,bottom:260-h-60});}
  function loop(){
    if(gameOver)return;
    ctx.clearRect(0,0,200,260);
    v+=gravity;y+=v;
    if(y<0||y>260) gameOverEnd();
    if(frame%90===0) spawn();
    ctx.fillStyle="green";
    obstacles.forEach(o=>{
      o.x-=2;
      ctx.fillRect(o.x,0,30,o.top);
      ctx.fillRect(o.x,260-o.bottom,30,o.bottom);
      if(90+0>o.x && 90+20<o.x+30 && (y<o.top||y>260-o.bottom)) gameOverEnd();
      if(o.x+30===90) score++;
    });
    document.getElementById('score').textContent="score: "+score;
    ctx.fillStyle="yellow"; ctx.fillRect(90,y,20,20);
    frame++;
    requestAnimationFrame(loop);
  }
  function gameOverEnd(){gameOver=true; load(`<h2 class="center">fin del juego</h2><p class="center">score: ${score}</p><div class="back" onclick="games()">volver</div>`,"flappyOver");}
  document.addEventListener("keydown",e=>{if(e.code==="Space"&&currentApp==="flappy")v=-6;});
  canvas.onclick=()=>{if(currentApp==="flappy")v=-6;};
  loop();
}

// =================== SNAKE ===================
function snake(){
  load(`<h2 class="center">snake</h2><canvas id="game" width="200" height="260"></canvas><p class="center" id="score">score: 0</p><div class="back" onclick="games()">volver</div>`,"snake");
  const canvas=document.getElementById("game");
  const ctx=canvas.getContext("2d");
  let size=10,snake=[[10,10]],dir=[1,0],food=[5,5],score=0,gameOver=false;
  function placeFood(){food=[Math.floor(Math.random()*20),Math.floor(Math.random()*26)];}
  placeFood();
  document.onkeydown=e=>{
    if(currentApp!=="snake")return;
    // Cambiamos dirección según tu solicitud
    if(e.key==='w'){if(dir[1]===0)dir=[0,-1];}
    if(e.key==='s'){if(dir[1]===0)dir=[0,1];}
    if(e.key==='a'){if(dir[0]===0)dir=[-1,0];}
    if(e.key==='d'){if(dir[0]===0)dir=[1,0];}
  };
  function loop(){
    if(gameOver)return;
    ctx.clearRect(0,0,200,260);
    let head=[snake[0][0]+dir[0],snake[0][1]+dir[1]];
    if(head[0]<0||head[0]>=20||head[1]<0||head[1]>=26||snake.some(s=>s[0]===head[0]&&s[1]===head[1])) return snakeOver();
    snake.unshift(head);
    if(head[0]===food[0]&&head[1]===food[1]){score++; document.getElementById('score').textContent="score: "+score; placeFood();}else snake.pop();
    ctx.fillStyle="lime"; snake.forEach(s=>ctx.fillRect(s[0]*size,s[1]*size,size-1,size-1));
    ctx.fillStyle="red"; ctx.fillRect(food[0]*size,food[1]*size,size-1,size-1);
    setTimeout(loop,100);
  }
  function snakeOver(){gameOver=true; load(`<h2 class="center">fin del juego</h2><p class="center">score: ${score}</p><div class="back" onclick="games()">volver</div>`,"snakeOver");}
  loop();
}

// =================== TECLADO MÚSICA ===================
document.addEventListener("keydown", e=>{
  if(currentApp==="music"){
    if(e.key==='q'){ volume=Math.max(0,volume-0.1); if(audio) audio.volume=volume; updateVolumeDisplay();}
    if(e.key==='e'){ volume=Math.min(1,volume+0.1); if(audio) audio.volume=volume; updateVolumeDisplay();}
  }
  if(e.key==='w' && currentApp==="watchface") menu(); 
  if(e.key==='s' && currentApp==="watchface") watchface();
  if(e.key==='x'){ if(currentApp!=="watchface" && currentApp!=="menu") menu(); }
});

// =================== INICIO ===================
watchface();
</script>
</body>
</html>
